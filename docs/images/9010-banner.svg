  <text x="80" y="105" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="4" fill="#1F5638">THE 90/10 AGENT BENCHMARK</text>
  <text x="72" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="230" font-weight="bold" fill="#111410">90/10</text>
  <text x="700" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#111410">Agent</text>
