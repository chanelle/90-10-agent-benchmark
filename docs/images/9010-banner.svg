<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="The 90/10 Agent Benchmark — 30 scenarios, 12 categories, 29 PASS, 1 PARTIAL, 0 FAIL">
